[package]
name = "zedcompress"
version = "0.2.0"
edition = "2021"
description = "ZedCompress - solid LZMA archiver with authenticated encryption (.zed)"

[[bin]]
name = "zed"
path = "src/main.rs"

[[bin]]
name = "zed-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.28", optional = true }
rfd = { version = "0.14", optional = true }
xz2 = "0.1"                                   # LZMA/xz (bundled liblzma, built via cc)
tar = "0.4"                                   # solid tar container
zip = { version = "2", default-features = false, features = ["deflate"] }
cipher = "0.4"                                # StreamCipher / KeyIvInit traits
chacha20 = "0.9"                              # ChaCha20 keystream (RustCrypto)
aes = "0.8"                                   # AES block cipher
ctr = "0.9"                                   # CTR mode -> AES-256-CTR keystream
hmac = "0.12"                                 # HMAC-SHA256 (encrypt-then-MAC)
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"                                  # random salt / IV
walkdir = "2"                                 # recursive directory walk
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"                            # progress bars
anyhow = "1"                                  # error handling
zeroize = "1"                                 # wipe derived keys from memory
rpassword = "7"                               # hidden interactive password entry
reed-solomon-erasure = "6"                    # Reed-Solomon parity for recovery records

[build-dependencies]
cc = "1"                                      # compiles the C + ASM native routines

[profile.release]
opt-level = 3
lto = true
